name: Report a mistake
description: Something on the guide is wrong, missing or broken.
title: "Mistake: "
labels: ["mistake"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page (filled in when you use the link on the site).
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: What the page says or does, and what you expected.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How do you know? (optional)
      description: A screenshot from the game helps most. Drag it into this box.
